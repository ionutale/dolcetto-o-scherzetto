<!doctype html>
<!-- TRICK THEATRE preview — throwaway, no deps, file://.
     Fake door + doorstep on an 852×393 stage; a button per trick plays one show
     via window.Theatre. Toast on onClimax, log line for hooks.sound. -->
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trick Theatre — preview per trucco</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --night-0:#191231; --ink:#4a3728; --cream:#f7ecd9;
    --amber:#ffd166; --paper:#fff6e5; --cream-line:rgba(247,236,217,.28);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100%;
    background:
      radial-gradient(1100px 560px at 70% -10%, #2c2352 0%, transparent 60%),
      var(--night-0);
    color:var(--cream); font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 16px 34px; gap:14px;
  }
  .row{ display:flex; align-items:center; gap:10px; }
  .badge{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    background:var(--amber); color:var(--ink); padding:4px 10px; border-radius:999px; }
  h1{ font-size:24px; font-weight:700; } h1 small{ font-weight:500; font-size:13px; opacity:.75; margin-left:8px; }

  .stage{
    position:relative; width:852px; height:393px; overflow:hidden;
    border-radius:26px; background:#241d45; user-select:none;
    box-shadow:0 30px 80px rgba(5,2,20,.6), 0 0 0 1px rgba(247,236,217,.10);
  }
  .scenery{ position:absolute; inset:0; pointer-events:none; }
  .labels{ position:absolute; left:12px; top:10px; font-size:11.5px; opacity:.5; letter-spacing:.06em; }

  .toast{
    position:absolute; left:50%; top:74px; transform:translate(-50%,-8px) scale(.9);
    background:var(--paper); color:var(--ink); font-weight:700; font-size:17px;
    padding:9px 20px; border-radius:999px; box-shadow:0 12px 30px rgba(10,6,30,.5);
    opacity:0; transition:transform .22s cubic-bezier(.3,1.5,.6,1), opacity .2s; pointer-events:none; z-index:60;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0) scale(1); }

  .ctrls{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; max-width:980px; }
  .ctrls button{
    font-family:inherit; font-size:13.5px; font-weight:600; border-radius:999px; cursor:pointer;
    border:1px solid var(--cream-line); background:rgba(247,236,217,.07); color:var(--cream);
    padding:9px 15px; transition:background .15s;
  }
  .ctrls button:hover{ background:rgba(247,236,217,.16); }
  .ctrls button:active{ transform:scale(.95); }
  #cancel2{ border-color:rgba(255,126,90,.5); color:#ffb59e; }
  #soundbar{
    width:852px; max-width:100%; display:flex; align-items:center; gap:10px;
    background:rgba(247,236,217,.06); border:1px solid rgba(247,236,217,.12);
    border-radius:14px; padding:9px 14px; font-size:13px;
  }
  #soundbar b{ color:var(--amber); font-weight:600; }
  #sndlog{ font-weight:600; letter-spacing:.02em; }
  .firefly{ position:absolute; width:6px; height:6px; border-radius:50%; background:#ffe9a8;
    box-shadow:0 0 10px 3px rgba(255,233,168,.5); animation:floaty 9s ease-in-out infinite; }
  @keyframes floaty{ 0%,100%{ transform:translate(0,0); opacity:.35 } 50%{ transform:translate(14px,-18px); opacity:.95 } }
</style>
</head>
<body>

<div class="row">
  <span class="badge">Prototipo</span>
  <h1>Trick Theatre <small>8 spettacoli · 852×393 · theatre.js</small></h1>
</div>

<div class="stage" id="stage">
  <div class="scenery"></div>
  <span class="labels">fake door · doorX 432 · doorY 263 (centro porta)</span>
  <div class="toast" id="toast">✨ climax!</div>
</div>

<div class="ctrls" id="ctrls"></div>

<div id="soundbar">
  <span>🔊</span><b>sound:</b> <span id="sndlog">—</span>
  <span style="flex:1"></span>
  <button id="testCancel" style="pointer-events:auto;border-color:rgba(255,126,90,.5);color:#ffb59e;background:transparent;font-family:inherit;font-size:12px;border-radius:999px;border:1px solid;padding:4px 10px;cursor:pointer">Theatre.cancel() ×2</button>
</div>

<script src="theatre.js"></script>
<script>
(function(){
  var stage = document.getElementById('stage');
  var toast = document.getElementById('toast');
  var sndlog = document.getElementById('sndlog');

  /* fake door drawn in-page (simple house wall + door + doormat) */
  stage.querySelector('.scenery').innerHTML =
    '<svg width="852" height="393" viewBox="0 0 852 393" style="position:absolute;inset:0;display:block">' +
      '<rect x="0" y="26" width="852" height="322" rx="14" fill="#6a4f77"/>' +
      '<rect x="0" y="26" width="852" height="20" fill="#5e4470" opacity=".65"/>' +
      '<rect x="120" y="92" width="48" height="60" rx="14" fill="#2a2038"/>' +
      '<rect x="125" y="97" width="38" height="50" rx="11" fill="#ffd9a0"/>' +
      '<rect x="684" y="92" width="48" height="60" rx="14" fill="#2a2038"/>' +
      '<rect x="689" y="97" width="38" height="50" rx="11" fill="#ffd9a0"/>' +
      '<rect x="376" y="198" width="112" height="124" rx="12" fill="#2a2038"/>' +
      '<rect x="384" y="206" width="96" height="110" rx="9" fill="#8a6a52"/>' +
      '<path d="M398 214 V304 M432 212 V306 M462 214 V304" stroke="#00000018" stroke-width="4"/>' +
      '<circle cx="462" cy="262" r="4.6" fill="#ffd166"/>' +
      '<rect x="386" y="210" width="92" height="10" rx="5" fill="#00000022"/>' +
      '<rect x="366" y="318" width="132" height="20" rx="8" fill="#57446c"/>' +
      '<rect x="0" y="338" width="852" height="55" fill="#3a2e4c"/>' +
      '<rect x="0" y="333" width="852" height="9" fill="#57446c"/>' +
      '<circle cx="640" cy="52" r="30" fill="rgba(255,246,221,.9)"/>' +
      '<circle cx="630" cy="47" r="5" fill="rgba(214,183,140,.4)"/>' +
      '<circle cx="647" cy="58" r="3.4" fill="rgba(214,183,140,.4)"/>' +
    '</svg>' +
    '<div class="doormat" style="position:absolute;left:386px;top:308px;width:92px;height:12px;border-radius:6px;background:#4a3728;box-shadow:0 3px 8px rgba(10,6,30,.3)"></div>' +
    '<div class="firefly" style="left:210px; top:300px"></div>' +
    '<div class="firefly" style="left:640px; top:286px; animation-delay:-3s"></div>';

  var toastT = null;
  var hooks = {
    sound: function (n) { sndlog.textContent = n; },
    onClimax: function (id) {
      toast.textContent = '✨ climax! · ' + id;
      toast.classList.add('show');
      if (toastT) clearTimeout(toastT);
      toastT = setTimeout(function () { toast.classList.remove('show'); }, 900);
    },
    onDone: function (id) {
      toast.textContent = 'show done · ' + id;
      toast.classList.add('show');
      if (toastT) clearTimeout(toastT);
      toastT = setTimeout(function () { toast.classList.remove('show'); }, 700);
    }
  };

  Theatre.init(stage);

  var names = { boo:'BOO!', ragnetto:'Ragnetto', serpente:'Serpente', cuscino:'Cuscino', maschera:'Maschera', topolino:'Topolino', fantasmino:'Fantasmino', mano:'Mano' };
  var div = document.getElementById('ctrls');
  ['boo','ragnetto','serpente','cuscino','maschera','topolino','fantasmino','mano'].forEach(function (id) {
    var b = document.createElement('button');
    b.setAttribute('data-trick', id);
    b.textContent = names[id];
    div.appendChild(b);
  });
  div.addEventListener('click', function (e) {
    var id = e.target.getAttribute && e.target.getAttribute('data-trick');
    if (!id) return;
    Theatre.start(id, 432, 263, hooks);
  });

  document.getElementById('testCancel').addEventListener('click', function () {
    Theatre.cancel(); Theatre.cancel();
    toast.textContent = 'cancel ×2 — ok';
    toast.classList.add('show');
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { toast.classList.remove('show'); }, 700);
  });
})();
</script>
</body>
</html>
